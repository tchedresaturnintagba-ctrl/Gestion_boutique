name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gestion_boutiques_test
          POSTGRES_USER: gestion_boutiques
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion_boutiques -d gestion_boutiques_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GB_ENVIRONMENT: test
      GB_DATABASE_URL: postgresql+asyncpg://gestion_boutiques:test-password@127.0.0.1:5432/gestion_boutiques_test
      GB_JWT_SECRET_KEY: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install -e "./apps/api[dev]"
      - name: Apply database migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Lint API
        working-directory: apps/api
        run: python -m ruff check src tests migrations
      - name: Test API
        working-directory: apps/api
        run: python -m pytest -q
      - name: Build API image
        run: docker build --file apps/api/Dockerfile apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Build web
        working-directory: apps/web
        run: npm run build